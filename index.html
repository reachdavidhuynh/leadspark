<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadSpark – Instant Personalized Cold Emails</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-14">
    <div class="max-w-3xl mx-auto px-6 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-3">LeadSpark</h1>
      <p class="text-xl text-indigo-100">Paste a LinkedIn URL or company + what you sell → get 3 personalized cold emails in seconds</p>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">LinkedIn URL or Company Name</label>
          <input id="target" type="text" placeholder="https://linkedin.com/in/... or Acme Corp"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">What are you selling / offering?</label>
          <textarea id="offer" rows="3" placeholder="e.g. AI tool that generates personalized cold emails in 15 seconds"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></textarea>
        </div>
        <button id="generateBtn" onclick="generate()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition">
          Generate 3 Personalized Emails
        </button>
      </div>

      <div id="results" class="mt-10 hidden space-y-5">
        <h2 class="text-xl font-semibold">Your 3 Personalized Emails</h2>
        <div id="emailList" class="space-y-4"></div>
      </div>
    </div>
    <p class="text-center text-sm text-slate-500 mt-8">Live demo • Built for rapid validation</p>
  </main>

  <script>
    const samples = [
      {
        subject: "Quick idea for your outreach at {company}",
        body: "Hi there,\n\nI noticed your work and thought this might help.\n\nMost teams still spend hours personalizing cold emails. LeadSpark turns any LinkedIn profile into 3 ready-to-send personalized emails in under 15 seconds.\n\nWould a quick example be useful?\n\nBest,\n[Your Name]"
      },
      {
        subject: "Personalized outreach without the busywork",
        body: "Hi,\n\nSaw what you're building and figured outreach might still be manual.\n\nWe help founders generate high-quality personalized emails in seconds so they can book more conversations.\n\nHappy to show you a live example if useful.\n\nCheers,\n[Your Name]"
      },
      {
        subject: "One question about your pipeline",
        body: "Hi,\n\nQuick question: how much time does your team spend writing personalized cold emails each week?\n\nWe built a simple tool that does the heavy lifting while keeping the human feel.\n\nOpen to a short look?\n\nThanks,\n[Your Name]"
      }
    ];

    function generate() {
      const btn = document.getElementById('generateBtn');
      const results = document.getElementById('results');
      const list = document.getElementById('emailList');
      const target = document.getElementById('target').value || "your company";

      btn.disabled = true;
      btn.textContent = "Generating...";
      list.innerHTML = "";

      setTimeout(() => {
        samples.forEach((email, i) => {
          const body = email.body.replace(/{company}/g, target);
          const card = document.createElement('div');
          card.className = "border border-slate-200 rounded-xl p-5 bg-slate-50";
          card.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <div class="font-medium text-slate-800">Subject: ${email.subject.replace('{company}', target)}</div>
              <button onclick="copyEmail(${i})" class="text-sm text-indigo-600 hover:underline">Copy</button>
            </div>
            <pre class="whitespace-pre-wrap text-sm text-slate-700 font-sans leading-relaxed">${body}</pre>
          `;
          list.appendChild(card);
        });
        results.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = "Generate 3 Personalized Emails";
      }, 1100);
    }

    function copyEmail(i) {
      const target = document.getElementById('target').value || "your company";
      const text = `Subject: ${samples[i].subject.replace('{company}', target)}\n\n${samples[i].body.replace(/{company}/g, target)}`;
      navigator.clipboard.writeText(text).then(() => alert("Copied!"));
    }
  </script>
</body>
</html>
